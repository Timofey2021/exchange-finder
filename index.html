<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор переводов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e9ebef; --surface:#ffffff; --hover:#f5f6f8; --best-bg:#f6efd8;
    --ink:#17191d; --muted:#61656d; --faint:#979da6;
    --line:#dbdee3; --line-soft:#e6e8ec;
    --accent:#8f7317; --accent-soft:#efe6cc;
    --gain:#15774f; --loss:#b83a32;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0f1215; --surface:#171a1f; --hover:#1c2026; --best-bg:#231e0f;
      --ink:#e9ecf0; --muted:#969ca6; --faint:#6b717a;
      --line:#262b32; --line-soft:#20242a;
      --accent:#d6a942; --accent-soft:#2a2410;
      --gain:#48c78d; --loss:#ef6a61;
    }
  }
  :root[data-theme="light"]{
    --paper:#e9ebef; --surface:#ffffff; --hover:#f5f6f8; --best-bg:#f6efd8;
    --ink:#17191d; --muted:#61656d; --faint:#979da6; --line:#dbdee3; --line-soft:#e6e8ec;
    --accent:#8f7317; --accent-soft:#efe6cc; --gain:#15774f; --loss:#b83a32;
  }
  :root[data-theme="dark"]{
    --paper:#0f1215; --surface:#171a1f; --hover:#1c2026; --best-bg:#231e0f;
    --ink:#e9ecf0; --muted:#969ca6; --faint:#6b717a; --line:#262b32; --line-soft:#20242a;
    --accent:#d6a942; --accent-soft:#2a2410; --gain:#48c78d; --loss:#ef6a61;
  }

  *{box-sizing:border-box}
  html,body{margin:0; overflow-x:hidden}
  .wrap{font-family:var(--sans); color:var(--ink); background:var(--paper); width:100%;
    min-height:100vh; padding:clamp(18px,4vw,44px) clamp(16px,4vw,44px) 60px; max-width:860px; margin:0 auto;
    line-height:1.45; -webkit-font-smoothing:antialiased;}

  /* ticker */
  .ticker{display:flex; align-items:center; gap:8px 18px; flex-wrap:wrap; font-family:var(--mono); font-size:12px;
    color:var(--muted); padding:0 0 12px; border-bottom:1px solid var(--line); margin-bottom:26px}
  .ticker .tk{display:flex; gap:6px; align-items:baseline; font-variant-numeric:tabular-nums}
  .ticker .tk .lbl{color:var(--faint)}
  .ticker .tk b{color:var(--ink); font-weight:600}
  .ticker .refresh{margin-left:auto; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--sans); font-weight:600; font-size:12px; color:var(--accent); background:transparent;
    border:1px solid var(--line); border-radius:7px; padding:5px 10px; white-space:nowrap}
  .ticker .refresh:hover{border-color:var(--accent); background:var(--accent-soft)}
  .ticker .refresh svg{width:13px; height:13px}
  .ticker .st{color:var(--faint); font-size:11px; flex-basis:100%; margin-top:2px}

  header{margin-bottom:24px}
  .kicker{font-family:var(--mono); font-size:12px; letter-spacing:.34em; color:var(--accent); font-weight:500; margin-bottom:11px; text-transform:uppercase}
  h1{font-size:clamp(28px,6.4vw,44px); line-height:1.0; margin:0; letter-spacing:-.03em; font-weight:700}

  /* controls */
  .controls{display:flex; flex-direction:column; gap:20px; margin-bottom:30px}
  .amount-wrap label,.field label{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:10px}
  .amount-field{display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--line); padding:0 2px 8px; transition:border-color .15s}
  .amount-field:focus-within{border-color:var(--accent)}
  #amount{flex:1; min-width:0; width:100%; border:0; background:transparent; color:var(--ink); font-family:var(--mono);
    font-size:clamp(28px,8vw,38px); font-weight:700; letter-spacing:-.02em; outline:none; padding:0; font-variant-numeric:tabular-nums}
  .cur-tag{font-family:var(--mono); font-size:20px; font-weight:600; color:var(--muted); flex:none}
  .grid2{display:grid; grid-template-columns:1fr; gap:20px}
  @media(min-width:600px){.grid2{grid-template-columns:1.15fr 1fr}}

  .seg{display:grid; grid-template-columns:repeat(auto-fit,minmax(82px,1fr)); gap:6px}
  .seg.small{grid-template-columns:1fr 1fr}
  .seg button{min-width:0; cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--muted);
    background:transparent; border:1px solid var(--line); border-radius:9px; padding:9px 6px; min-height:48px; line-height:1.15; text-align:center; transition:all .13s}
  .seg button .cc{display:block; font-family:var(--mono); font-size:10px; font-weight:500; color:var(--faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .seg button:hover{border-color:var(--accent); color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
  .seg button[aria-pressed="true"] .cc{color:color-mix(in srgb,var(--paper) 62%,transparent)}
  .seg button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* results ledger */
  .res-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 12px; flex-wrap:wrap}
  .res-head h2{font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0; font-weight:500}
  .res-head .cnt{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .res-head .cnt b{color:var(--ink); font-weight:600}

  .ledger{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .row{padding:15px 16px; border-top:1px solid var(--line); transition:background .12s}
  .row:first-child{border-top:none}
  .row:hover{background:var(--hover)}
  .row.best{background:var(--best-bg)}
  .row-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .row-name{font-weight:600; font-size:15px; letter-spacing:-.01em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0}
  .tag{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line)); padding:2px 6px; border-radius:4px; white-space:nowrap}
  .row-out{font-family:var(--mono); font-weight:700; font-size:19px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; white-space:nowrap}
  .row-bot{display:flex; align-items:baseline; justify-content:space-between; gap:8px 14px; margin-top:8px; flex-wrap:wrap}
  .row-steps{font-family:var(--mono); font-size:11.5px; color:var(--faint); line-height:1.6; flex:1 1 55%; min-width:0}
  .row-delta{font-family:var(--mono); font-size:12px; white-space:nowrap; text-align:right; margin-left:auto; font-variant-numeric:tabular-nums}
  .row-delta .pct{font-weight:700; margin-right:8px}
  .row-delta .amt{color:var(--muted)}

  /* rates editor */
  details.rates{margin-top:24px; border-top:1px solid var(--line); padding-top:4px}
  details.rates summary{cursor:pointer; padding:14px 2px; font-weight:600; font-size:13.5px; color:var(--accent); display:inline-flex; align-items:center; gap:8px; list-style:none; user-select:none}
  details.rates summary::-webkit-details-marker{display:none}
  details.rates summary svg{width:15px; height:15px}
  .rgroup{padding:2px 2px 6px}
  .rgroup h3{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:600; margin:16px 0 9px}
  .rnote{font-family:var(--mono); font-size:11px; color:var(--faint); margin:8px 0 2px; line-height:1.5}
  .rates-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
  .rate-field label{display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-bottom:6px}
  .rate-field input{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:14px; font-weight:600; padding:8px 10px; border-radius:8px; outline:none; font-variant-numeric:tabular-nums}
  .rate-field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .rates-foot{display:flex; justify-content:flex-end; padding:16px 2px 4px}
  .reset{cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px}
  .reset:hover{color:var(--ink); border-color:var(--accent)}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div class="wrap">
  <div class="ticker">
    <span class="tk" id="rbRates"></span>
    <button type="button" class="refresh" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Обновить</button>
    <span class="st" id="rateStatus"></span>
  </div>

  <header>
    <div class="kicker">₽ · Ft · € · USDT</div>
    <h1>Калькулятор переводов</h1>
  </header>

  <section class="controls">
    <div class="grid2">
      <div class="amount-wrap">
        <label for="amount">Сумма</label>
        <div class="amount-field">
          <input id="amount" type="number" inputmode="decimal" min="0" value="10000" aria-label="Сумма">
          <span class="cur-tag" id="fromSym">₽</span>
        </div>
      </div>
      <div class="field">
        <label>День недели</label>
        <div class="seg small" id="wkSeg" role="group" aria-label="День недели"></div>
      </div>
    </div>
    <div class="field">
      <label>У меня есть</label>
      <div class="seg" id="fromSeg" role="group" aria-label="Исходный актив"></div>
    </div>
    <div class="field">
      <label>Хочу получить</label>
      <div class="seg" id="toSeg" role="group" aria-label="Цель"></div>
    </div>
  </section>

  <div class="res-head">
    <h2 id="resTitle">Маршруты</h2>
    <span class="cnt" id="resCnt"></span>
  </div>
  <section class="ledger" id="results"></section>

  <details class="rates">
    <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Изменить курсы и комиссии</summary>
    <div id="ratesBody"></div>
    <div class="rates-foot"><button class="reset" type="button" id="resetBtn">Сбросить</button></div>
  </details>
</div>

<script>
(function(){
  "use strict";

  var CUR = {
    RUB: {sym:"₽",   dp:0, name:"рубли",  short:"Рубли",   code:"₽"},
    HUF: {sym:"Ft",  dp:0, name:"форинты",short:"Форинты", code:"Ft"},
    EUR: {sym:"€",   dp:2, name:"евро",   short:"Евро",    code:"€"},
    EURC:{sym:"€",   dp:2, name:"евро",   short:"Евро нал",code:"€ нал"},
    USDT:{sym:"USDT",dp:2, name:"USDT",   short:"USDT",    code:"USDT"}
  };

  var DEF = {
    eu:1.1561, eh:362.7, ur:82.30,
    exch:4.62, altynIn:-0.15, ntCard:-5.75, ntRU:-3.85, aRU:-4.77,
    cash:2.45, pEU:-8.90, sUE:-0.70, bybit:-2.30,
    acRH:-6.15, aRE:-5.97, wEH:-0.70, wHE:-1.30, fEH:-3.10, otp:-4.90,
    revWk:-0.60, revWe:-1.60
  };

  var WORLD = [["eu","1 € = $ (EUR/USD)","0.0001"],["eh","1 € = Ft (EUR/HUF)","0.1"],["ur","1 $ = ₽ (USD/RUB)","0.01"]];
  var DGROUPS = [
    {title:"USDT ↔ рубли  (%, + выгода / − потеря)", items:[["exch","обменник в РФ USDT→₽"],["altynIn","Altyn USDT→₽"],["ntCard","Antarctic→карта USDT→₽"],["ntRU","Antarctic ₽→USDT"],["aRU","Altyn ₽→USDT"]]},
    {title:"EUR ↔ USDT  (%)", items:[["cash","наличка €→USDT"],["pEU","криптобиржа €↔USDT (P2P)"],["sUE","USDT→€ на бирже"]]},
    {title:"Карты  (%)", items:[["bybit","Bybit-карта USDT→Ft"],["acRH","Altyn карта ₽→Ft"],["aRE","Altyn ₽→€ (Freedom)"],["wEH","Wise €→Ft"],["wHE","Wise Ft→€"],["fEH","Freedom €→Ft"],["otp","OTP внутри банка Ft→€"]]},
    {title:"Revolut  (%)", items:[["revWk","будни"],["revWe","выходные"]]}
  ];

  function af(x){ return 1 + x/100; }
  function er(R){ return R.ur*R.eu; }
  function rev(R,wk){ return af(wk ? R.revWe : R.revWk); }

  // ---- Legs (directed hops). Routes are generated as every simple path
  // from source to target that transits ONLY through the hubs EUR / USDT
  // (you never route THROUGH rubles or forints — those are only ends). ----
  var HUB = { EUR:1, USDT:1 };
  var LEG = [
    {f:"RUB", t:"USDT", via:"Antarctic",        step:"Antarctic: ₽→USDT",             m:function(R){return (1/R.ur)*af(R.ntRU);}},
    {f:"RUB", t:"USDT", via:"Altyn-крипта",     step:"Altyn: ₽→USDT (крипта)",        m:function(R){return (1/R.ur)*af(R.aRU);}},
    {f:"USDT",t:"RUB",  via:"обменник в РФ",    step:"Обменник в РФ: USDT→₽",          m:function(R){return R.ur*af(R.exch);}, exch:true},
    {f:"USDT",t:"RUB",  via:"Altyn",            step:"Altyn: USDT→₽",                 m:function(R){return R.ur*af(R.altynIn);}},
    {f:"USDT",t:"RUB",  via:"Antarctic",        step:"Antarctic: USDT→₽ на карту РФ",  m:function(R){return R.ur*af(R.ntCard);}},
    {f:"EUR", t:"USDT", via:"криптобиржа",      step:"Криптобиржа: €→USDT (P2P)",      m:function(R){return R.eu*af(R.pEU);}},
    {f:"USDT",t:"EUR",  via:"криптобиржа",      step:"Криптобиржа: USDT→€ (P2P)",      m:function(R){return (1/R.eu)*af(R.sUE);}},
    {f:"EURC",t:"USDT", via:"наличный обменник",step:"Обменник: наличка €→USDT",       m:function(R){return R.eu*af(R.cash);}},
    {f:"HUF", t:"EUR",  via:"Revolut",          step:"Revolut: Ft→€",                 m:function(R,wk){return (1/R.eh)*rev(R,wk);}},
    {f:"HUF", t:"EUR",  via:"Wise",             step:"Wise: Ft→€",                    m:function(R){return (1/R.eh)*af(R.wHE);}},
    {f:"HUF", t:"EUR",  via:"OTP",              step:"OTP: Ft→€ внутри банка",         m:function(R){return (1/R.eh)*af(R.otp);}},
    {f:"EUR", t:"HUF",  via:"Revolut",          step:"Revolut: €→Ft",                 m:function(R,wk){return R.eh*rev(R,wk);}},
    {f:"EUR", t:"HUF",  via:"Wise",             step:"Wise: €→Ft",                    m:function(R){return R.eh*af(R.wEH);}},
    {f:"EUR", t:"HUF",  via:"Freedom",          step:"Freedom: €→$→Ft",               m:function(R){return R.eh*af(R.fEH);}},
    {f:"USDT",t:"HUF",  via:"Bybit-карта",      step:"Bybit: карта платит в Ft",       m:function(R){return (R.eh/R.eu)*af(R.bybit);}},
    {f:"RUB", t:"HUF",  via:"Altyn-карта",      step:"Altyn: карта платит в Ft",       m:function(R){return (R.eh/er(R))*af(R.acRH);}},
    {f:"RUB", t:"EUR",  via:"Altyn → Freedom",  step:"Altyn: ₽ → на евросчёт Freedom", last:true, m:function(R){return (1/er(R))*af(R.aRE);}}
  ];
  var SPEND = {
    HUF:{label:"OTP-карта напрямую", step:"OTP: платишь картой в Ft"},
    EUR:{label:"Трата в евро (Freedom / Wise / Revolut)", step:"Платишь картой в €"}
  };
  var ASSETS = ["RUB","HUF","EUR","EURC","USDT"];

  function buildRoutes(){
    var EDGES = {}; LEG.forEach(function(l){ (EDGES[l.f]=EDGES[l.f]||[]).push(l); });
    var out = [];
    Object.keys(SPEND).forEach(function(c){
      out.push({f:c,t:c,label:SPEND[c].label,steps:[SPEND[c].step],exch:false,m:function(){return 1;}});
    });
    function walk(node, target, visited, chain){
      (EDGES[node]||[]).forEach(function(l){
        if(l.t!==target && !HUB[l.t]) return;   // transit only through hubs
        if(l.last && l.t!==target) return;      // delivery legs can only be last
        if(visited[l.t]) return;                // no repeated nodes
        var ch = chain.concat(l);
        if(l.t===target){
          out.push({
            f:ch[0].f, t:target,
            label:ch.map(function(x){return x.via;}).join(" → "),
            steps:ch.map(function(x){return x.step;}),
            exch:ch.some(function(x){return x.exch;}),
            m:(function(c){return function(R,wk){var p=1; for(var i=0;i<c.length;i++)p*=c[i].m(R,wk); return p;};})(ch)
          });
        } else {
          var v2={}; for(var k in visited)v2[k]=1; v2[l.t]=1;
          walk(l.t, target, v2, ch);
        }
      });
    }
    ASSETS.forEach(function(f){ ASSETS.forEach(function(t){
      if(f!==t){ var v={}; v[f]=1; walk(f, t, v, []); }
    });});
    return out;
  }
  var ROUTES = buildRoutes();

  var TARGETS = { RUB:["HUF","EUR","USDT"], HUF:["HUF","EUR","RUB"], EUR:["EUR","HUF","RUB","USDT"], EURC:["RUB","USDT"], USDT:["RUB","EUR","HUF"] };
  var DEFTGT = { RUB:"HUF", HUF:"EUR", EUR:"RUB", EURC:"RUB", USDT:"RUB" };
  var FROMS = ["RUB","HUF","EUR","EURC","USDT"];
  var MIN_EXCH = { HUF:800000, EUR:2000, EURC:2000, USDT:2200 };

  var state = { amount:10000, from:"RUB", to:"HUF", weekend:false, R:Object.assign({},DEF) };

  var nfc={};
  function fmt(v,c){ var dp=CUR[c].dp; if(!nfc[c]) nfc[c]=new Intl.NumberFormat("ru-RU",{minimumFractionDigits:dp,maximumFractionDigits:dp}); return nfc[c].format(v)+" "+CUR[c].sym; }
  function fmtRate(x){ var d=x>=100?1:x>=10?2:x>=1?3:4; return new Intl.NumberFormat("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d}).format(x); }
  function valEUR(c,R){ if(c==="EUR"||c==="EURC")return 1; if(c==="HUF")return 1/R.eh; if(c==="RUB")return 1/er(R); if(c==="USDT")return 1/R.eu; return 1; }
  function marketMult(f,t,R){ return valEUR(f,R)/valEUR(t,R); }
  function sev(delta){ if(delta>=-0.015)return "var(--gain)"; if(delta>=-0.045)return "var(--muted)"; return "var(--loss)"; }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

  function buildWk(){
    var box=document.getElementById("wkSeg"); box.innerHTML="";
    [["Будни",false],["Выходные",true]].forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.textContent=o[0]; b.setAttribute("aria-pressed",state.weekend===o[1]);
      b.addEventListener("click",function(){state.weekend=o[1]; buildWk(); render();}); box.appendChild(b);
    });
  }
  function buildFrom(){
    var box=document.getElementById("fromSeg"); box.innerHTML="";
    FROMS.forEach(function(c){
      var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-pressed",state.from===c);
      b.innerHTML=CUR[c].short+'<span class="cc">'+CUR[c].code+"</span>";
      b.addEventListener("click",function(){ if(state.from===c)return; state.from=c;
        if(TARGETS[c].indexOf(state.to)<0) state.to=DEFTGT[c];
        document.getElementById("fromSym").textContent=CUR[c].sym; buildFrom(); buildTo(); render(); });
      box.appendChild(b);
    });
  }
  function buildTo(){
    var box=document.getElementById("toSeg"); box.innerHTML="";
    TARGETS[state.from].forEach(function(c){
      var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-pressed",state.to===c);
      var lbl=(c===state.from)?"Потратить":("В "+CUR[c].name);
      b.innerHTML=lbl+'<span class="cc">'+(state.from==="EURC"?"€ нал":state.from)+" → "+c+"</span>";
      b.addEventListener("click",function(){ if(state.to===c)return; state.to=c; buildTo(); render(); });
      box.appendChild(b);
    });
  }

  function buildRates(){
    var body=document.getElementById("ratesBody"); body.innerHTML="";
    var wg=el("div","rgroup"); wg.appendChild(el("h3",null,"Мировой курс (тянется автоматически)"));
    var wgrid=el("div","rates-grid");
    WORLD.forEach(function(it){
      var f=el("div","rate-field"); var lab=el("label",null,it[1]); lab.setAttribute("for","r_"+it[0]);
      var inp=document.createElement("input"); inp.type="number"; inp.id="r_"+it[0]; inp.value=state.R[it[0]]; inp.step=it[2];
      inp.addEventListener("input",function(){var v=parseFloat(inp.value); if(!isNaN(v)&&v>0){state.R[it[0]]=v; render();}});
      f.appendChild(lab); f.appendChild(inp); wgrid.appendChild(f);
    });
    wg.appendChild(wgrid); wg.appendChild(el("p","rnote","USD/₽ у бесплатных источников бывает неточным — если выглядит странно, впиши курс ЦБ вручную.")); body.appendChild(wg);
    DGROUPS.forEach(function(g){
      var wrap=el("div","rgroup"); wrap.appendChild(el("h3",null,g.title));
      var grid=el("div","rates-grid");
      g.items.forEach(function(it){
        var f=el("div","rate-field"); var lab=el("label",null,it[1]); lab.setAttribute("for","r_"+it[0]);
        var inp=document.createElement("input"); inp.type="number"; inp.id="r_"+it[0]; inp.value=state.R[it[0]]; inp.step="0.1";
        inp.addEventListener("input",function(){var v=parseFloat(inp.value); if(!isNaN(v)){state.R[it[0]]=v; render();}});
        f.appendChild(lab); f.appendChild(inp); grid.appendChild(f);
      });
      wrap.appendChild(grid); body.appendChild(wrap);
    });
  }
  function syncRateInputs(){ Object.keys(DEF).forEach(function(k){ var e=document.getElementById("r_"+k); if(e) e.value=state.R[k]; }); }
  function updateBar(){ var R=state.R; document.getElementById("rbRates").innerHTML=
    '<span class="lbl">1€=</span><b>'+fmtRate(R.eu)+'</b>$ &nbsp;<span class="lbl">1€=</span><b>'+fmtRate(R.eh)+'</b>Ft &nbsp;<span class="lbl">1$=</span><b>'+fmtRate(R.ur)+'</b>₽'; }

  function render(){
    var R=state.R, amt=state.amount, f=state.from, t=state.to, wk=state.weekend;
    var mkt=marketMult(f,t,R);
    var list=ROUTES.filter(function(x){return x.f===f&&x.t===t&&!(x.exch&&amt<(MIN_EXCH[f]||0));}).map(function(x){return {r:x,mult:x.m(R,wk)};}).sort(function(a,b){return b.mult-a.mult;});
    document.getElementById("resTitle").textContent=(t===f?"Трата в "+CUR[t].name:"Перевод в "+CUR[t].name);
    var marketOut=amt*mkt;
    document.getElementById("resCnt").innerHTML=(t===f?"":"по рынку было бы <b>"+fmt(marketOut,t)+"</b>");
    var results=document.getElementById("results"); results.innerHTML="";
    list.forEach(function(item,i){
      var rt=item.r, mult=item.mult, out=amt*mult, delta=mult/mkt-1, diff=out-marketOut, col=sev(delta), best=(i===0&&list.length>1);
      var row=el("div","row"+(best?" best":""));
      var topR=el("div","row-top");
      var name=el("div","row-name"); name.appendChild(document.createTextNode(rt.label));
      if(best) name.appendChild(el("span","tag","лучший"));
      topR.appendChild(name); topR.appendChild(el("div","row-out",fmt(out,t))); row.appendChild(topR);
      var botR=el("div","row-bot");
      botR.appendChild(el("div","row-steps",rt.steps.join("   →   ")));
      var d=el("div","row-delta");
      var pct=el("span","pct",(delta>=0?"+":"−")+Math.abs(delta*100).toFixed(1).replace(".",",")+"%"); pct.style.color=col; d.appendChild(pct);
      var amtEl=el("span","amt");
      if(f===t || Math.abs(diff)<0.5){ amtEl.textContent="по рынку"; }
      else if(diff>0){ amtEl.textContent="выгода +"+fmt(diff,t)+" · "+fmt(diff/mkt,f); amtEl.style.color=col; }
      else { amtEl.textContent="теряешь "+fmt(-diff,t)+" · "+fmt(-diff/mkt,f); }
      d.appendChild(amtEl); botR.appendChild(d); row.appendChild(botR);
      results.appendChild(row);
    });
    updateBar();
  }

  function refreshWorld(){
    var st=document.getElementById("rateStatus"); st.textContent="обновляю…";
    fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.rates||!j.rates.EUR) throw 0;
      var E=j.rates.EUR, H=j.rates.HUF, U=j.rates.RUB;
      state.R.eu=+(1/E).toFixed(4); if(H) state.R.eh=+(H/E).toFixed(2); if(U) state.R.ur=+(U).toFixed(2);
      ["eu","eh","ur"].forEach(function(k){var e=document.getElementById("r_"+k); if(e)e.value=state.R[k];});
      var d=j.time_last_update_utc ? new Date(j.time_last_update_utc) : new Date();
      st.textContent="курс обновлён "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}); updateBar(); render();
    }).catch(function(){ st.textContent="авто-курс недоступен — курс можно вписать вручную"; });
  }

  document.getElementById("amount").addEventListener("input",function(e){var v=parseFloat(e.target.value); state.amount=isNaN(v)?0:v; render();});
  document.getElementById("refreshBtn").addEventListener("click",refreshWorld);
  document.getElementById("resetBtn").addEventListener("click",function(){ state.R=Object.assign({},DEF); syncRateInputs(); updateBar(); render(); });

  buildWk(); buildFrom(); buildTo(); buildRates(); updateBar(); render(); refreshWorld();
})();
</script>
</body>
</html>
